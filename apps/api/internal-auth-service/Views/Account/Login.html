<!doctype html>
<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Sign in — Bren Raphael's Enterprise Suite</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link href="/css/account/login.css" rel="stylesheet" />
    <script src="/js/account/tailwind.config.js"></script>
  </head>
  <body class="bg-neutral-200/50 text-foreground flex flex-col min-h-screen">
    <main
      class="flex-grow flex flex-col items-center justify-center px-margin-mobile md:px-margin-desktop"
    >
      <!-- Login Card -->
      <div
        class="w-full max-w-md bg-surface-container-lowest border border-outline-variant p-xl md:p-3xl shadow-sm rounded-lg"
      >

        <!-- Identity Section -->
        <div class="mb-xl text-center">
          <h1
            class="font-display-sm text-display-sm text-primary mb-xs tracking-tight"
          >
            Bren Raphael's
          </h1>
          <p
            class="font-body-sm text-body-sm text-on-surface-variant opacity-70"
          >
            Enterprise Suite
          </p>
        </div>

        <!-- Injected Error Handler Wrapper -->
        <div class="error-wrapper">{{errorHtml}}</div>

        <!-- Login Form -->
        <form
          class="space-y-lg"
          id="loginForm"
          method="post"
          action="/Account/Login"
        >
          <input type="hidden" name="returnUrl" value="{{returnUrl}}" />

          <!-- Username Field -->
          <div class="space-y-xs transition-transform duration-200">
            <label
              class="font-label-md text-label-md text-on-surface block mb-base font-semibold"
              for="username"
              >Username / Employee ID</label
            >
            <div class="relative">
              <input
                class="w-full h-12 px-md font-body-md text-body-md border border-outline-variant focus:border-primary focus:ring-0 transition-colors bg-neutral-100 outline-none rounded-lg"
                id="username"
                name="username"
                placeholder="YYYY-II-NNN"
                required
                type="text"
                aria-describedby="username-error"
              />
            </div>
            <p id="username-error" class="field-error hidden"></p>
          </div>

          <!-- Password Field -->
          <div class="space-y-xs transition-transform duration-200">
            <div class="flex items-center justify-between">
              <label
                class="font-label-md text-label-md text-on-surface block mb-base font-semibold"
                for="password"
                >Password</label
              >
            </div>
            <div class="relative">
              <input
                class="w-full h-12 px-md pr-12 font-body-md text-body-md border border-outline-variant focus:border-primary focus:ring-0 transition-colors bg-neutral-100 outline-none rounded-lg"
                id="password"
                name="password"
                placeholder="••••••••"
                required
                type="password"
                aria-describedby="password-error"
              />
              <button
                type="button"
                id="togglePassword"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors cursor-pointer"
                aria-label="Toggle password visibility"
              >
                <span class="material-symbols-outlined text-[20px]">visibility</span>
              </button>
            </div>
            <p id="password-error" class="field-error hidden"></p>
          </div>

          <!-- Login Button -->
          <div class="pt-md flex flex-col gap-sm justify-center items-center">
            <button
              class="w-full h-12 bg-primary text-on-primary font-semibold text-sm rounded-lg flex items-center justify-center gap-sm hover:opacity-90 active:scale-[0.98] transition-all duration-200 cursor-pointer"
              type="submit"
              id="submitBtn"
            >
              Login
              <span class="material-symbols-outlined text-[18px]"
                >arrow_forward</span
              >
            </button>
            <span class="text-sm cursor-pointer justify-center text-primary hover:underline">
              <a href="/Account/ForgotPassword?returnUrl={{returnUrl}}" class="font-semibold"
                >Forgot Password?</a
              >
            </span>
          </div>
        </form>
      </div>

      <!-- Docs Link -->
      <a
        href="https://localhost:3010/docs"
        target="_blank"
        class="mt-lg text-sm font-medium text-on-surface-variant hover:text-primary hover:underline transition-colors"
      >
        Read the docs
      </a>
    </main>

    <!-- Footer -->
    <footer
      class="w-full py-xl border-t border-outline-variant bg-white"
    >
      <div
        class="max-w-max-width mx-auto px-margin-desktop flex flex-col md:flex-row justify-between items-center gap-md"
      >
        <p
          class="font-body-sm text-body-sm text-on-surface-variant text-center md:text-left"
        >
          © 2026 Bren Raphael's Enterprise Suite. All rights reserved.
        </p>
        <div class="flex gap-xl">
          <span
            class="font-label-sm text-label-sm text-outline cursor-default hover:text-primary transition-colors"
            >Security</span
          >
          <span
            class="font-label-sm text-label-sm text-outline cursor-default hover:text-primary transition-colors"
            >Privacy</span
          >
        </div>
      </div>
    </footer>

    <!-- Background Geometric Lines & Atmospheric Elements -->
    <div class="fixed inset-0 pointer-events-none -z-10 overflow-hidden select-none">
      <div class="absolute inset-0 opacity-65">
        <!-- Grid pattern -->
        <svg
          class="absolute inset-0 h-full w-full stroke-gray-300/80 [mask-image:radial-gradient(100%_100%_at_top,white,transparent)] dark:stroke-neutral-700/60"
          aria-hidden="true"
        >
          <defs>
            <pattern
              id="grid-pattern"
              width="40"
              height="40"
              patternUnits="userSpaceOnUse"
              x="-1"
              y="-1"
            >
              <path d="M.5 40V.5H40" fill="none" />
            </pattern>
          </defs>
          <rect width="100%" height="100%" stroke-width="0" fill="url(#grid-pattern)" />
        </svg>

        <!-- Concentric circles and intersecting lines -->
        <svg
          class="absolute left-1/2 top-1/2 h-[64rem] w-[64rem] -translate-x-1/2 -translate-y-1/2 stroke-gray-400 [mask-image:radial-gradient(closest-side,white,transparent)] dark:stroke-neutral-600"
          aria-hidden="true"
          viewBox="0 0 1024 1024"
          fill="none"
        >
          <circle cx="512" cy="512" r="512" stroke-width="1" stroke-dasharray="4 4" />
          <circle cx="512" cy="512" r="400" stroke-width="1" />
          <circle cx="512" cy="512" r="280" stroke-width="1" stroke-dasharray="2 2" />
          <circle cx="512" cy="512" r="160" stroke-width="1" />

          <line x1="0" y1="0" x2="1024" y2="1024" stroke-width="1" />
          <line x1="1024" y1="0" x2="0" y2="1024" stroke-width="1" />
          <line x1="512" y1="0" x2="512" y2="1024" stroke-width="1" stroke-dasharray="8 8" />
          <line x1="0" y1="512" x2="1024" y2="512" stroke-width="1" stroke-dasharray="8 8" />
        </svg>
      </div>

      <div
        class="absolute top-[-10%] right-[-10%] w-[40%] h-[40%] bg-primary/5 rounded-full blur-[120px]"
      ></div>
      <div
        class="absolute bottom-[-5%] left-[-5%] w-[30%] h-[30%] bg-secondary-container/20 rounded-full blur-[100px]"
      ></div>
    </div>

    <script src="/js/account/login.js"></script>
  </body>
</html>
